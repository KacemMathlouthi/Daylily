appId: app.daylily.desktop
productName: Daylily
copyright: Copyright © 2026 Daylily
directories:
  output: release
  buildResources: resources
# The app is fully bundled by electron-vite; nothing else needs to ship
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/icon.png
    to: icon.png
win:
  icon: resources/icon.ico
  # An unpacked folder: a portable .exe re-extracts the whole runtime on every launch,
  # which takes seconds; the installer comes with signed releases
  target:
    - target: dir
      arch: [x64]
  # Editing the .exe (icon, version info) needs Wine on Linux; the CI Windows build will do it
  signAndEditExecutable: false
