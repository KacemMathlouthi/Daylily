name: Release

# After CI passes on main, semantic-release reads the merged commits and, if a
# feat or fix arrived, tags the next version and drafts its GitHub Release. The
# installers are then built on each OS, attached with their checksums, and the
# release is published. A tag can also be built by hand, as the first was.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: A release tag to build the installers for, like v0.1.0
        required: true

permissions:
  contents: read

# One release at a time, never cancelled halfway
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag || inputs.tag }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - if: github.event_name == 'workflow_run'
        uses: actions/checkout@v5
        with:
          # The commit CI passed on; if main has moved on since, semantic-release
          # sees it's behind and leaves the release to that newer commit's run
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - if: github.event_name == 'workflow_run'
        uses: pnpm/action-setup@v6
      - if: github.event_name == 'workflow_run'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: github.event_name == 'workflow_run'
        run: pnpm install --frozen-lockfile
      - id: release
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The first release was cut by hand; with no tag yet, semantic-release would start at 1.0.0
          if [ -z "$(git tag --list 'v*')" ]; then
            echo "No release tag yet, so nothing is released automatically."
            exit 0
          fi
          before=$(git tag --points-at HEAD --list 'v*')
          pnpm release
          after=$(git tag --points-at HEAD --list 'v*')
          # Only a tag this run made is a new release
          if [ "$after" != "$before" ]; then
            echo "tag=$(comm -13 <(echo "$before") <(echo "$after") | head -n 1)" >> "$GITHUB_OUTPUT"
          fi

  installers:
    needs: version
    if: needs.version.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/installers.yml
    with:
      ref: ${{ needs.version.outputs.tag }}
      version: ${{ needs.version.outputs.tag }}
      release: ${{ needs.version.outputs.tag }}

  publish:
    needs: [version, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checksums
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir installers
          # Only the installers: not the updater's latest*.yml and blockmaps, nor
          # the list a rerun finds among the assets
          shopt -s extglob
          (cd installers && sha256sum -- !(*.yml|*.blockmap|SHA256SUMS) > ../SHA256SUMS)
          gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
