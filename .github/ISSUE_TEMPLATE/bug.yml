name: Something isn't right
description: A bug, a crash, or words that went missing
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. Please don't paste anything private from your journal.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. Open today's page
        2. …
  - type: input
    id: version
    attributes:
      label: Daylily version
      description: Settings › About shows it.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Computer
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Windows
        - Linux (AppImage)
        - Linux (deb)
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, your time zone if it's about sealing, or a file that won't open (with private words removed).
